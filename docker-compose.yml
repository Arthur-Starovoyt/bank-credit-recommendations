version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: credit-postgres
    environment:
      POSTGRES_DB: credit_db
      POSTGRES_USER: admin
      POSTGRES_PASSWORD: admin123
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin"]
      interval: 30s
      timeout: 10s
      retries: 3

volumes:
  postgres_data: